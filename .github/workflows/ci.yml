name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://cafe_app_login:cafe_app_ci@localhost:5432/cafe
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cafe
      TEST_DATABASE_URL: postgresql://cafe_app_login:cafe_app_ci@localhost:5432/cafe_test
      TEST_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cafe_test
      APP_DB_PASSWORD: cafe_app_ci
      AUTH_SECRET: segredo-somente-para-o-ci-0123456789abcdef
      AUTH_TRUST_HOST: "true"
      # Chave fictícia de CI para os dados pessoais cifrados (§3.3).
      DADOS_PESSOAIS_CHAVE: dGVzdGUtY2hhdmUtZmljdGljaWEtMzItYnl0ZXMhISE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Migrações no banco de desenvolvimento do CI
        run: npx prisma migrate deploy && npm run db:papel-app
      - name: Testes de domínio e integração (isolamento entre empresas)
        run: npm test
      - name: Build
        run: npm run build
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes e2e
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
